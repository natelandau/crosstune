# Commitizen runs from the repository root so one bump moves every deployable.
# `cz` itself is an API dev dependency: `just commit`, `just bump`, or
# `uv run --project api cz ...`.
[tool.commitizen]
    annotated_tag            = true
    bump_message             = "bump(release): v$current_version → v$new_version"
    changelog_file           = "CHANGELOG.md"
    name                     = "cz_conventional_commits"
    tag_format               = "v$version"
    update_changelog_on_bump = true
    version                  = "1.1.1"
    version_provider         = "commitizen"
    # Regexes pick the line in each file that carries the version.
    version_files = [
        "api/pyproject.toml:^\\s*version\\s*=",
        "api/src/crosstune/__init__.py:__version__",
        'web/package.json:"version"',
        "apple/Config/Version.xcconfig:^MARKETING_VERSION",
    ]
    # uv.lock and the OpenAPI contract both record the API package's version, so
    # the hook regenerates them, and the web types built from the contract, after
    # the version files change and stages them so the bump commit carries them.
    pre_bump_hooks = ["scripts/bump-lock.sh"]
