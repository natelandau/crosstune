# Read by `just apple::deadcode`, which builds both index stores first. The package's store
# covers its tests; the Xcode build's covers the app target and the iOS-only code.
index_store_path:
  - .build/out
  - ../.build/DerivedData/Index.noindex/DataStore
skip_build: true
# `just contract` writes these from the API's schema.
report_exclude:
  - "**/Generated/**"
  - "**/CrosstuneVocabulary/Vocabulary.swift"
# Access levels are not checked: a module marks its API public whether or not another uses it.
disable_redundant_public_analysis: true
# Synthesized conformances read these properties, which the index does not record.
retain_codable_properties: true
retain_equatable_properties: true
relative_results: true
strict: true
disable_update_check: true
