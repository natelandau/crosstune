# One rule set for every Python file in the repository. Ruff reads the nearest config file,
# so no folder holds a config of its own.
cache-dir = ".cache/ruff"
exclude = [".cache", ".dev", ".git", ".venv", "build", "dist", "api/src/crosstune/db/migrations/versions"]
fix = true
line-length = 100
output-format = "grouped"
src = ["api/src", "api/tests", "scripts", "apple/scripts", "analytics"]
target-version = "py313"

[per-file-target-version]
# Runs on the macOS system python3, so CI can call it before the tooling environment exists.
"apple/scripts/source_packages.py" = "py39"

[lint]
select = ["ALL"]
ignore = [
    "ANN002",
    "ANN003",
    "ANN204",
    "ANN401",
    "B008",   # FastAPI Depends() in defaults
    "COM812",
    "CPY001",
    "D107",
    "E501",
    "FIX002",
    "TD001",
    "TD002",
    "TD003",
]
unfixable = ["ERA001", "F401", "F841"]

[lint.per-file-ignores]
"{**/tests/**/*.py,analytics/test_*.py}" = [
    "ANN001",
    "ANN201",
    "ARG001",
    "ARG002",
    "D102",
    "D103",
    "INP001",
    "PLR2004",
    "S101",
    "S105",
    "S106",
    "SLF001",
]
# Command-line tools: they print, and they run commands found on PATH.
"{scripts,apple/scripts,analytics}/**/*.py" = ["T201", "S603", "S607"]
"api/src/crosstune/db/migrations/env.py" = ["INP001"]
"api/src/crosstune/ops/*.py" = ["T201"]

[lint.mccabe]
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.pylint]
max-args = 7

[lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "crosstune.db.base.Base",
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
]

[format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"
skip-magic-trailing-comma = false
