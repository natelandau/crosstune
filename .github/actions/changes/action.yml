---
name: Changes
description: Decide whether a workflow's checks need to run for this event

inputs:
  pattern:
    description: Extended regular expression matched against each changed path
    required: true
  exclude:
    description: Extended regular expression for changed paths that never count, even when pattern matches them
    default: ""

outputs:
  relevant:
    description: "'true' when the checks need to run"
    value: ${{ steps.decide.outputs.relevant }}

# A pull request runs the checks when a changed path matches. A bump commit on a branch
# skips them, because the Release workflow runs them on the tag it makes. Every other
# event runs them.
runs:
  using: composite
  steps:
    - id: decide
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        EVENT: ${{ github.event_name }}
        PR: ${{ github.event.pull_request.number }}
        REF_TYPE: ${{ github.ref_type }}
        MESSAGE: ${{ github.event.head_commit.message }}
        PATTERN: ${{ inputs.pattern }}
        EXCLUDE: ${{ inputs.exclude }}
      run: |
        relevant=true
        if [[ "$EVENT" == pull_request ]]; then
          # A skipped required check passes, so a failed lookup runs the checks.
          # A rename lists its old path too, so moving a file out of an area counts.
          # The files endpoint stops at 3000 files, so a larger list may omit a matching path.
          if ! count=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .changed_files); then
            echo "::warning::could not read the pull request; running every check"
          elif (( count >= 3000 )); then
            echo "::warning::the pull request changes $count files, more than can be listed; running every check"
          elif files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)'); then
            if [[ -n "$EXCLUDE" ]]; then files=$(grep -vE "$EXCLUDE" <<< "$files" || true); fi
            grep -qE "$PATTERN" <<< "$files" || relevant=false
          else
            echo "::warning::could not list the pull request's files; running every check"
          fi
        elif [[ "$REF_TYPE" == branch && "$MESSAGE" == "bump(release):"* ]]; then
          relevant=false
        fi
        printf 'relevant=%s\n' "$relevant" >> "$GITHUB_OUTPUT"
