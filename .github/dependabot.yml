---
# npm and uv updates arrive as one grouped pull request per ecosystem each month; the
# other ecosystems open one pull request per dependency, because closing an ungrouped
# pull request makes Dependabot skip that version, and closing a grouped one does not.
# The prefix becomes the PR title's conventional-commit type and scope, and the PR title
# becomes the squashed commit's subject, so group names stay short.
version: 2

updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(web)
    # @ionic/react-router peers on react-router and react-router-dom <7,
    # typescript-eslint does not support TypeScript 7, and @types/node follows
    # the Node major in web/.node-version.
    ignore:
      - dependency-name: react-router
        update-types: ["version-update:semver-major"]
      - dependency-name: react-router-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(site)
    # typescript-eslint and @astrojs/check do not support TypeScript 7, and @types/node
    # follows the Node major in site/.node-version.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /api
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(api)
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(api)

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(dev)

  - package-ecosystem: swift
    directories:
      - /apple/CrosstuneKit
      - /apple/Tools
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(apple)

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(pre-commit)
