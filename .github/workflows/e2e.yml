---
name: E2E

# Not a required status check. The suite signs in through the live Clerk development
# instance, so a Clerk outage would block unrelated merges if this gated pull requests.
on:
  pull_request:
    paths: ["web/**", "api/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

# Each run spends sign-ins against the Clerk development instance's usage limits.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crosstune
          POSTGRES_PASSWORD: crosstune
          POSTGRES_DB: crosstune
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crosstune -d crosstune"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      CROSSTUNE_CLERK_ISSUER: ${{ vars.CROSSTUNE_CLERK_ISSUER }}
      CROSSTUNE_CLERK_AUTHORIZED_PARTIES: '["http://localhost:4173"]'
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      CROSSTUNE_LOCAL_STORAGE_ENDPOINT_URL: http://localhost:9000
      CROSSTUNE_STORAGE_BUCKET: crosstune-e2e
      CROSSTUNE_STORAGE_ACCESS_KEY_ID: crosstune
      CROSSTUNE_STORAGE_SECRET_ACCESS_KEY: crosstune-local-secret
      CROSSTUNE_LOCAL_STORAGE_BROWSER_ENDPOINT_URL: /storage
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
        working-directory: api
      # The API transcodes recordings with ffprobe and ffmpeg from PATH.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: start RustFS and create the buckets
        run: |
          docker compose up -d --wait rustfs
          just api::storage-setup
      - name: start the api on the database the suite owns
        working-directory: api
        run: |
          nohup just run-e2e > "$RUNNER_TEMP/api.log" 2>&1 &
          # The recipe creates and migrates the database before it serves, so this waits for
          # more than a process start.
          for _ in $(seq 1 90); do
            curl -fsS http://localhost:8001/healthz > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: just e2e
        working-directory: web
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
      # Server-side failures such as a transcode error show only in the API's own log.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: api-log
          path: ${{ runner.temp }}/api.log
          if-no-files-found: ignore
