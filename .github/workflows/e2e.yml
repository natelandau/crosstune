---
name: E2E

# Not a required status check. The suite signs in through the live Clerk development
# instance, so a Clerk outage would block unrelated merges if this gated pull requests.
on:
  pull_request:
    # The suite drives the built app and the running API, so a change to their unit or
    # browser tests alone cannot change its result.
    paths:
      - "web/**"
      - "api/**"
      - "scripts/ci-media-tools.sh"
      - "compose.yml"
      - "justfile"
      - ".github/workflows/e2e.yml"
      - ".github/actions/setup-node/**"
      - "!api/tests/**"
      - "!web/**/*.test.ts"
      - "!web/**/*.test.tsx"
      - "!web/src/test/**"
      - "!web/vitest.config.ts"
      - "!**/*.md"
  workflow_dispatch:

# Each run spends sign-ins against the Clerk development instance's usage limits.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of relocking.
  UV_LOCKED: "1"
  CI: "true"

jobs:
  e2e:
    # Fork and Dependabot runs get no Actions secrets and cannot sign in, so they are
    # skipped outright.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crosstune
          POSTGRES_PASSWORD: crosstune
          POSTGRES_DB: crosstune
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crosstune -d crosstune"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      CROSSTUNE_CLERK_ISSUER: ${{ vars.CROSSTUNE_CLERK_ISSUER }}
      CROSSTUNE_CLERK_AUTHORIZED_PARTIES: '["http://localhost:4173"]'
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
      CROSSTUNE_LOCAL_STORAGE_ENDPOINT_URL: http://localhost:9000
      CROSSTUNE_STORAGE_BUCKET: crosstune-e2e
      CROSSTUNE_STORAGE_ACCESS_KEY_ID: crosstune
      CROSSTUNE_STORAGE_SECRET_ACCESS_KEY: crosstune-local-secret
      CROSSTUNE_LOCAL_STORAGE_BROWSER_ENDPOINT_URL: /storage
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: ./.github/actions/setup-node
        with:
          module: web
          chromium: "true"
      - run: uv sync --all-groups
        working-directory: api
      # The API transcodes recordings with ffprobe and ffmpeg from PATH.
      - name: use the API image's ffmpeg
        run: scripts/ci-media-tools.sh
      - name: start RustFS
        run: docker compose up -d --wait rustfs
      # run-e2e creates and migrates the database and the buckets before it serves.
      - name: start the api on the database the suite owns
        working-directory: api
        env:
          CROSSTUNE_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: |
          nohup just run-e2e > "$RUNNER_TEMP/api.log" 2>&1 &
          just wait-e2e "$!" "$RUNNER_TEMP/api.log"
      # The Clerk secret stays off the install steps, which run third-party code.
      - run: just e2e
        working-directory: web
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAILS: ${{ secrets.E2E_CLERK_USER_EMAILS }}
      # Only a failed attempt leaves a directory in test-results, so this also catches a
      # test that passed on retry, which leaves the job green.
      - name: find failed attempts
        id: attempts
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(find web/test-results -mindepth 1 -maxdepth 1 -type d 2>/dev/null)" ]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      # The repository is public, and a trace holds the test users' emails and dev-instance
      # session tokens, so these expire after a day.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || steps.attempts.outputs.failed == 'true' }}
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 1
          if-no-files-found: ignore
      # Server-side failures such as a transcode error show only in the API's own log.
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || steps.attempts.outputs.failed == 'true' }}
        with:
          name: api-log
          path: ${{ runner.temp }}/api.log
          retention-days: 3
          if-no-files-found: ignore
