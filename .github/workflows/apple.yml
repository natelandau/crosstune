---
name: Apple

on:
  pull_request:
    paths: &paths
      - "apple/**"
      # The scripts workflow checks the tooling scripts; the Apple jobs run only these three.
      - "!apple/scripts/**"
      - "apple/scripts/scrub-env.sh"
      - "apple/scripts/xcodebuild.sh"
      - "apple/scripts/source_packages.py"
      - "fixtures/**"
      - "api/openapi.json"
      - "analytics/tracking-plan.json"
      - "scripts/gate-cache.sh"
      - "scripts/settings.just"
      - ".github/workflows/apple.yml"
  push:
    branches: [main]
    paths: *paths
  workflow_call:
    inputs:
      skip_build:
        description: Skip the unsigned build, for a caller that archives the app itself
        type: boolean
        default: false

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main and a Release call, falls back to its own run ID and is never canceled.
concurrency:
  group: apple-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of relocking.
  UV_LOCKED: "1"
  CI: "true"

# The checks run as parallel jobs, so a run takes as long as its slowest job. A bump commit on
# `main` skips them, because the Release workflow runs them on the tag it makes. Only `main`
# saves caches: a pull request's cache is readable by that pull request alone.
jobs:
  test:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):')
    name: Apple lint and tests
    # The image with the Xcode the app is built and shipped with. The `macos-*` images
    # default to an older Xcode.
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@v4
      - run: xcodebuild -version
      # A build from another Swift compiler cannot be reused, so the compiler is in the
      # cache keys.
      - name: read the Swift compiler version
        id: swift
        run: printf 'version=%s\n' "$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - run: just lint
      # A cache of its own: the test build's compiler flags differ from the app's, so it shares
      # few entries with the build jobs' caches.
      - name: name the Xcode cache
        id: xcode-key
        run: |
          sources="$(git ls-files -s . | shasum | cut -c1-12)"
          printf 'key=apple-xcode-tests-%s-%s\n' "$SWIFT" "$sources" >> "$GITHUB_OUTPUT"
        env:
          SWIFT: ${{ steps.swift.outputs.version }}
      - uses: actions/cache/restore@v6
        id: xcode-restore
        with:
          path: apple/CrosstuneKit/.build/DerivedData/CompilationCache.noindex
          key: ${{ steps.xcode-key.outputs.key }}
          restore-keys: apple-xcode-tests-${{ steps.swift.outputs.version }}-
      # Built in its own step so a slow compile and a slow test run each have their own limit;
      # `just test` then reuses the build.
      - run: just build-tests
        timeout-minutes: 20
      - run: just test
        timeout-minutes: 10
      - uses: actions/cache/save@v6
        if: ${{ github.ref == 'refs/heads/main' && steps.xcode-restore.outputs.cache-hit != 'true' }}
        with:
          path: apple/CrosstuneKit/.build/DerivedData/CompilationCache.noindex
          key: ${{ steps.xcode-key.outputs.key }}

  build:
    if: ${{ !inputs.skip_build && (github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):')) }}
    name: Apple build (${{ matrix.platform }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, macos]
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v4
      - run: xcodebuild -version
      - name: read the Swift compiler version
        id: swift
        run: printf 'version=%s\n' "$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # Keyed on the tracked sources rather than a hash of the tree, which the build writes into.
      - name: name the Xcode cache
        id: xcode-key
        run: |
          sources="$(git ls-files -s . | shasum | cut -c1-12)"
          printf 'key=apple-xcode-%s-%s-%s\n' "$PLATFORM" "$SWIFT" "$sources" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}
          SWIFT: ${{ steps.swift.outputs.version }}
      # Every run starts from the newest cache `main` saved for its platform, and `main` saves
      # what it ends with. The build's size limit prunes what recent builds left unused.
      - uses: actions/cache/restore@v6
        id: xcode-restore
        with:
          path: apple/.build/DerivedData/CompilationCache.noindex
          key: ${{ steps.xcode-key.outputs.key }}
          restore-keys: apple-xcode-${{ matrix.platform }}-${{ steps.swift.outputs.version }}-
      - run: just build "$PLATFORM"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/cache/save@v6
        if: ${{ github.ref == 'refs/heads/main' && steps.xcode-restore.outputs.cache-hit != 'true' }}
        with:
          path: apple/.build/DerivedData/CompilationCache.noindex
          key: ${{ steps.xcode-key.outputs.key }}

  contract:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):')
    name: Apple contract
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v4
      - run: xcodebuild -version
      - name: read the Swift compiler version
        id: swift
        run: printf 'version=%s\n' "$(swift --version 2>&1 | shasum | cut -c1-12)" >> "$GITHUB_OUTPUT"
      # The contract tools compile the OpenAPI generator, which changes only with the lockfile.
      - uses: actions/cache/restore@v6
        id: tools-restore
        with:
          path: apple/Tools/.build
          key: apple-tools-${{ steps.swift.outputs.version }}-${{ hashFiles('apple/Tools/Package.resolved') }}
          restore-keys: apple-tools-${{ steps.swift.outputs.version }}-
      - run: just contract
      - name: fail if the committed Swift client or vocabulary is stale
        working-directory: .
        run: |
          git add --intent-to-add \
            apple/CrosstuneKit/Sources/CrosstuneAPI/Generated \
            apple/CrosstuneKit/Sources/CrosstuneVocabulary/Vocabulary.swift
          git diff --exit-code -- \
            apple/CrosstuneKit/Sources/CrosstuneAPI/Generated \
            apple/CrosstuneKit/Sources/CrosstuneVocabulary/Vocabulary.swift
      - uses: actions/cache/save@v6
        if: ${{ github.ref == 'refs/heads/main' && steps.tools-restore.outputs.cache-hit != 'true' }}
        with:
          path: apple/Tools/.build
          key: ${{ steps.tools-restore.outputs.cache-primary-key }}

  # Each Xcode cache is close to a gigabyte against the repository's 10 GB, and a run reads only
  # the newest of its kind (iOS, macOS, or tests), so that one replaces the rest. This job runs
  # no repository code, which keeps the token that can delete caches away from the build.
  prune-xcode-cache:
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Prune the Xcode caches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: delete every Xcode cache but the newest of each kind
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          declare -A kept
          while read -r key; do
            platform="${key#apple-xcode-}"
            platform="${platform%%-*}"
            if [[ "$platform" =~ ^(ios|macos|tests)$ ]] && [[ -z "${kept[$platform]:-}" ]]; then
              kept[$platform]="$key"
              continue
            fi
            # A run that pruned at the same time may have deleted it already.
            gh cache delete "$key" || echo "::warning::could not delete cache $key"
          done < <(gh cache list --key apple-xcode- --ref refs/heads/main --sort created_at --order desc \
            --limit 100 --json key --jq '.[].key')
