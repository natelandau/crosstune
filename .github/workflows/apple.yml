---
name: Apple

on:
  pull_request:
    paths: ["apple/**", "api/openapi.json", ".github/workflows/apple.yml", "justfile"]
  push:
    branches: [main]
    paths: ["apple/**", "api/openapi.json", ".github/workflows/apple.yml", "justfile"]

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main, falls back to its own run ID and is never canceled.
concurrency:
  group: apple-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

# macOS minutes cost more than Linux minutes, so one job runs every check.
jobs:
  check:
    if: ${{ !startsWith(github.event.head_commit.message, 'bump(release):') }}
    name: Apple check
    # The image with the Xcode the app is built and shipped with. The `macos-*` images
    # default to an older Xcode.
    runs-on: xcode-27
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - run: xcodebuild -version
      - run: just lint
      - name: "diagnose: run the suite with unbuffered output and sample it if it stalls"
        env:
          NSUnbufferedIO: "YES"
        run: |
          swift build --package-path CrosstuneKit --build-tests
          swift test --package-path CrosstuneKit --skip-build &
          tests=$!
          for _ in $(seq 1 360); do
            kill -0 "$tests" 2> /dev/null || break
            sleep 1
          done
          if ! kill -0 "$tests" 2> /dev/null; then
            wait "$tests"
            exit $?
          fi
          echo "::error::the suite was still running after 6 minutes"
          pgrep -fl 'swiftpm-testing|xctest|PackageTests' || true
          for pid in $(pgrep -f 'swiftpm-testing|xctest|PackageTests'); do
            ps -o pid,etime,command -p "$pid"
            sample "$pid" 5 -file "$RUNNER_TEMP/sample-$pid.txt" > /dev/null 2>&1 || true
            cat "$RUNNER_TEMP/sample-$pid.txt" 2> /dev/null || true
          done
          pkill -f 'swiftpm-testing|xctest|PackageTests' || true
          kill "$tests" 2> /dev/null || true
          exit 1
      - run: just test
        timeout-minutes: 15
      - run: just build
      - run: just contract
      - name: fail if the committed Swift client or vocabulary is stale
        working-directory: .
        run: |
          git add --intent-to-add \
            apple/CrosstuneKit/Sources/CrosstuneAPI/Generated \
            apple/CrosstuneKit/Sources/CrosstuneVocabulary/Vocabulary.swift
          git diff --exit-code -- \
            apple/CrosstuneKit/Sources/CrosstuneAPI/Generated \
            apple/CrosstuneKit/Sources/CrosstuneVocabulary/Vocabulary.swift
