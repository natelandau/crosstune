---
name: Release

# Railway and Workers Builds deploy production from the `production` branch,
# and neither host can trigger on a tag. Pushing a version tag moves that
# branch to the tagged commit, so a tag is the only thing that reaches
# production. The branch moves only after the API, Web, and Apple workflows
# pass and the Apple release builds archive on that commit, which gates every
# client in one place. Those archives then go to TestFlight. A manual run
# started from a tag, under "Use workflow from", moves the branch to that tag
# and uploads that version again, which is how an older version is put back.
# The site is not part of a release: it deploys production from `main`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # The called workflows' change detection asks for it, and a called job can hold
  # no permission its caller lacks.
  pull-requests: read

# Queue rather than cancel, so an older run never lands after a newer one.
concurrency:
  group: production-branch
  cancel-in-progress: false

jobs:
  api:
    name: API
    uses: ./.github/workflows/api.yml
  web:
    name: Web
    uses: ./.github/workflows/web.yml
  # The archive job compiles the app, so the check skips its own build.
  apple:
    name: Apple
    uses: ./.github/workflows/apple.yml
    with:
      skip_build: true
  promote:
    name: Move the production branch to the tag
    needs: [api, web, apple, archive]
    runs-on: ubuntu-latest
    steps:
      - name: require a version tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::start this workflow from a version tag, not from $GITHUB_REF"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The repository squash-merges, so a tag made on a pull request branch
      # points at a commit that never reaches `main`. Refuse it.
      - name: require the tagged commit to be on main
        run: git merge-base --is-ancestor HEAD origin/main
      - run: git push --force origin "HEAD:refs/heads/production"

  # Runs beside the checks, so a release build that fails to compile holds
  # promote. The environment admits `v*` tags only.
  archive:
    name: Archive the Apple apps
    runs-on: xcode-27
    environment: app-store
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      # The archive needs a development identity. Without one, Xcode creates a new
      # development certificate on the account every run, and its key dies with the
      # runner, so the account fills with dead certificates.
      - name: import the development certificate
        env:
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_DEVELOPMENT_P12" | base64 --decode > "$RUNNER_TEMP/development.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/development.p12" -P "$APPLE_DEVELOPMENT_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/development.p12"
          # Lets codesign use the key without a password prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: write the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      # The run number only rises, and a re-run raises the attempt, so no two
      # uploads share a build number. The archive fixes the number, so a new
      # upload needs this job re-run, not only the upload.
      - name: archive
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
          BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: just archive "$BUILD_NUMBER"
      # An artifact keeps neither symlinks nor the executable bit, and an app
      # bundle needs both, so the archives travel as a tarball.
      - name: pack the archives
        run: tar -cf "$RUNNER_TEMP/archives.tar" -C .build archives
      - uses: actions/upload-artifact@v7
        with:
          name: apple-archives
          path: ${{ runner.temp }}/archives.tar
          if-no-files-found: error
          retention-days: 7
      - name: fail if Xcode created a development certificate
        if: always()
        run: |
          if security find-identity -v -p codesigning | grep -q "Created via API"; then
            echo "::error::Xcode created a development certificate; revoke it in the developer portal"
            exit 1
          fi
      - name: delete the key and the keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/development.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  # Runs after promote, so the build reaches testers only once the tag is on
  # main and production is deploying the API it calls.
  testflight:
    name: Upload to TestFlight
    needs: [promote]
    runs-on: xcode-27
    environment: app-store
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: actions/download-artifact@v8
        with:
          name: apple-archives
          path: ${{ runner.temp }}
      - name: unpack the archives
        run: mkdir -p .build && tar -xf "$RUNNER_TEMP/archives.tar" -C .build
      - name: write the App Store Connect key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: upload
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}
        run: just upload
      # Cloud signing exports without the development identity; this catches
      # an export that wanted one anyway.
      - name: fail if Xcode created a development certificate
        if: always()
        run: |
          if security find-identity -v -p codesigning | grep -q "Created via API"; then
            echo "::error::Xcode created a development certificate; revoke it in the developer portal"
            exit 1
          fi
      - name: delete the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
