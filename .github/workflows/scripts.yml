---
name: Scripts

on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "apple/scripts/**", "api/pyproject.toml", "api/uv.lock", ".github/workflows/scripts.yml", "justfile"]

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main, falls back to its own run ID and is never canceled.
concurrency:
  group: scripts-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of relocking.
  UV_LOCKED: "1"
  CI: "true"

jobs:
  # A required check runs on every pull request and skips when it touches nothing it
  # covers; a skipped job passes a required check, a missing one blocks it. The scripts
  # run on the API's uv project, so a change to its dependencies counts.
  changes:
    name: Scripts changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
        with:
          pattern: '^(scripts/|apple/scripts/|api/pyproject\.toml$|api/uv\.lock$|\.github/workflows/scripts\.yml$|justfile$)'

  check:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Scripts check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just lint
      - run: just test
