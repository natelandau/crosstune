---
name: Scripts

on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "apple/scripts/**", "**/*.py", "ruff.toml", "ty.toml", "pyproject.toml", "uv.lock", ".github/workflows/**", ".pre-commit-config.yaml", "**/justfile", "**/*.just", "fixtures/**", "web/src/**", "apple/CrosstuneKit/Sources/**", "apple/CrosstuneKit/Tests/**", "api/**"]

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main, falls back to its own run ID and is never canceled.
concurrency:
  group: scripts-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of relocking.
  UV_LOCKED: "1"
  CI: "true"

jobs:
  # A required check runs on every pull request and skips when it touches nothing it
  # covers; a skipped job passes a required check, a missing one blocks it. The lint
  # covers every Python file outside api/, the scripts run on the root tooling
  # project, so a change to its dependencies counts, and the tests read every justfile,
  # workflow, and hook, and every fixture and the files fixtures/manifest.json lists.
  changes:
    name: Scripts changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
        with:
          pattern: '^(scripts/|apple/scripts/|ruff\.toml$|ty\.toml$|pyproject\.toml$|uv\.lock$|\.github/workflows/|\.pre-commit-config\.yaml$|fixtures/|web/src/|apple/CrosstuneKit/(Sources|Tests)/|api/)|\.py$|(^|/)justfile$|\.just$'

  check:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Scripts check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - run: just lint
      - run: just test
