---
name: Web

on:
  pull_request:
    paths: ["web/**", "brand/**", "api/openapi.json", ".github/workflows/web.yml", "justfile"]
  push:
    branches: [main]
    paths: ["web/**", "brand/**", "api/openapi.json", ".github/workflows/web.yml", "justfile"]
  workflow_call:

permissions:
  contents: read

env:
  CI: "true"

# A bump commit on `main` skips these jobs, because the Release workflow runs
# them on the tag it makes. The called jobs see the tag ref, so they run there.
jobs:
  check:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):')
    name: Web check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      - run: pnpm install --frozen-lockfile
      # The component tests run in real Chromium, because Ionic is web
      # components with shadow DOM that jsdom does not render.
      - run: pnpm exec playwright install --with-deps chromium
      - run: just lint
      - run: just test
      - run: just build

  contract:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):')
    name: Web contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: extractions/setup-just@v4
      - run: pnpm install --frozen-lockfile
      - run: just contract
      - name: fail if the committed client types are stale
        working-directory: .
        run: git diff --exit-code -- web/src/api/schema.d.ts web/src/api/vocabulary.ts
