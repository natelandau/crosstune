---
name: Analytics

on:
  pull_request:
  push:
    branches: [main]
    paths: ["analytics/**", "api/pyproject.toml", "api/uv.lock", ".github/workflows/analytics.yml", "justfile"]

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main, falls back to its own run ID and is never canceled.
concurrency:
  group: analytics-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of relocking.
  UV_LOCKED: "1"
  CI: "true"

jobs:
  # The checks are required, so they run on every pull request and skip when it touches
  # nothing they cover; a skipped job passes a required check, a missing one blocks it.
  # The checker runs on the API's uv project, so a change to its dependencies counts.
  changes:
    name: Analytics changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
        with:
          pattern: '^(analytics/|api/pyproject\.toml$|api/uv\.lock$|\.github/workflows/analytics\.yml$|justfile$)'

  check:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Analytics check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: just check
      - run: just test
