---
name: Site

on:
  pull_request:
  push:
    branches: [main]
    paths: ["site/**", "brand/**", ".github/workflows/site.yml", ".github/actions/setup-node/**", "justfile"]

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main, falls back to its own run ID and is never canceled.
concurrency:
  group: site-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of relocking.
  UV_LOCKED: "1"
  CI: "true"

jobs:
  # The checks are required, so they run on every pull request and skip when it touches
  # nothing they cover; a skipped job passes a required check, a missing one blocks it.
  changes:
    name: Site changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
        with:
          pattern: '^(site/|brand/|\.github/workflows/site\.yml$|\.github/actions/setup-node/|justfile$)'

  check:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: Site check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          module: site
      - uses: astral-sh/setup-uv@v7
      - run: just lint
      - run: just test
      - run: just build
