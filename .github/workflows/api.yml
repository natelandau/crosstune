---
name: API

on:
  pull_request:
    paths:
      ["api/**", "scripts/**", ".github/workflows/api.yml", ".pre-commit-config.yaml", "web/src/api/openapi.json"]
  push:
    branches: [main]
    paths:
      ["api/**", "scripts/**", ".github/workflows/api.yml", ".pre-commit-config.yaml", "web/src/api/openapi.json"]
  workflow_call:

permissions:
  contents: read

env:
  CI: "true"

# A bump commit on `main` skips these jobs, because the Release workflow runs
# them on the tag it makes. The called jobs see the tag ref, so they run there.
jobs:
  lint:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):')
    name: API lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: just lint
      - run: uv run shellcheck ../scripts/smoke.sh
      - name: prek
        working-directory: .
        run: |
          uv run --project api prek run --all-files --config .pre-commit-config.yaml
        env:
          PREK_SKIP: pytest,ty,web-eslint,web-prettier,web-tsc

  test:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):')
    name: API test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: docker info
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: just test

  contract:
    if: github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):')
    name: API contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: just contract
      - name: fail if the committed contract is stale
        working-directory: .
        run: git diff --exit-code -- web/src/api/openapi.json
