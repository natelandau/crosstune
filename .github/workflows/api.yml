---
name: API

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "scripts/**"
      - ".github/**"
      - ".pre-commit-config.yaml"
      - ".typos.toml"
      - "compose.yml"
      - "justfile"
  workflow_call:

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main and a Release call, falls back to its own run ID and is never canceled.
concurrency:
  group: api-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of relocking.
  UV_LOCKED: "1"
  CI: "true"

jobs:
  # The checks are required, so they run on every pull request and skip when it touches
  # nothing they cover; a skipped job passes a required check, a missing one blocks it.
  # The lint job's hooks also lint every workflow, so any change under .github counts.
  changes:
    name: API changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      image: ${{ steps.image.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
        with:
          pattern: '^(api/|scripts/|\.github/|\.pre-commit-config\.yaml$|\.typos\.toml$|compose\.yml$|justfile$)'
      - id: image
        uses: ./.github/actions/changes
        with:
          pattern: '^(\.github/workflows/api\.yml|api/(Dockerfile|\.dockerignore|pyproject\.toml|uv\.lock|alembic\.ini))$'

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: just lint
      # The module hooks it skips run in `just lint` here and in the web, site, Apple, and
      # analytics workflows.
      - run: just lint-repo
        working-directory: .

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      # The RustFS compatibility tests fail rather than skip when CI is set.
      - name: start RustFS
        working-directory: .
        run: docker compose up -d --wait rustfs
      - name: use the API image's ffmpeg
        working-directory: .
        run: scripts/ci-media-tools.sh
      - run: just test

  # Railway builds the full image only after merge, and production's build only after
  # Release has promoted, so this is the one check that the image builds and imports
  # without the dev groups. A push to main skips it because its pull request ran it;
  # a Release call runs it so a broken image never reaches promote.
  image:
    needs: changes
    if: >-
      needs.changes.outputs.image == 'true'
      && !(github.event_name == 'push' && github.ref_type == 'branch')
    name: API Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --tag crosstune-api api
      - run: docker run --rm --entrypoint python crosstune-api -c "import crosstune.main"
      - run: docker run --rm --entrypoint alembic crosstune-api heads

  contract:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: just contract
      - name: fail if the committed contract is stale
        working-directory: .
        run: git diff --exit-code -- api/openapi.json
