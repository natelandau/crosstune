---
name: API

on:
  pull_request:
  push:
    branches: [main]
    paths:
      ["api/**", "scripts/**", ".github/workflows/api.yml", ".pre-commit-config.yaml"]
  workflow_call:

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main and a Release call, falls back to its own run ID and is never canceled.
concurrency:
  group: api-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"

# A bump commit on `main` skips these jobs, because the Release workflow runs
# them on the tag it makes. The called jobs see the tag ref, so they run there.
jobs:
  # The checks are required, so they run on every pull request and skip when it touches
  # nothing they cover; a skipped job passes a required check, a missing one blocks it.
  changes:
    name: API changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE" ] || git diff --name-only "$BASE...$HEAD" | grep -qE '^(api/|scripts/|\.github/workflows/api\.yml$|\.pre-commit-config\.yaml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: changes
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):'))
    name: API lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: just lint
      - run: uv run shellcheck ../scripts/smoke.sh
      - name: prek
        working-directory: .
        run: |
          uv run --project api prek run --all-files --config .pre-commit-config.yaml
        env:
          PREK_SKIP: pytest,ty,web-eslint,web-prettier,web-tsc

  test:
    needs: changes
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):'))
    name: API test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: docker info
      # The RustFS compatibility tests fail rather than skip when CI is set.
      - name: start RustFS
        working-directory: .
        run: docker compose up -d --wait rustfs
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: just test

  contract:
    needs: changes
    if: >-
      needs.changes.outputs.relevant == 'true' &&
      (github.ref_type == 'tag' || !startsWith(github.event.head_commit.message, 'bump(release):'))
    name: API contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: just contract
      - name: fail if the committed contract is stale
        working-directory: .
        run: git diff --exit-code -- api/openapi.json
