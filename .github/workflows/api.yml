---
name: API

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "scripts/**"
      - ".github/**"
      - ".pre-commit-config.yaml"
      - ".typos.toml"
      - "compose.yml"
  workflow_call:

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main and a Release call, falls back to its own run ID and is never canceled.
concurrency:
  group: api-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of relocking.
  UV_LOCKED: "1"
  CI: "true"

jobs:
  # The checks are required, so they run on every pull request and skip when it touches
  # nothing they cover; a skipped job passes a required check, a missing one blocks it.
  # The lint job's hooks also lint every workflow, so any change under .github counts.
  changes:
    name: API changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
        with:
          pattern: '^(api/|scripts/|\.github/|\.pre-commit-config\.yaml$|\.typos\.toml$|compose\.yml$)'

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: just lint
      - name: prek
        working-directory: .
        run: |
          uv run --project api prek run --all-files --config .pre-commit-config.yaml
        env:
          # Hooks another job already runs: ty in `just lint`, and the web, site, and Swift
          # hooks in their own workflows, whose toolchains this runner lacks. A new hook of
          # that kind belongs here.
          PREK_SKIP: pytest,ty,web-eslint,web-prettier,web-tsc,site-eslint,site-prettier,site-tsc,apple-swift-format

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      # The RustFS compatibility tests fail rather than skip when CI is set.
      - name: start RustFS
        working-directory: .
        run: docker compose up -d --wait rustfs
      - name: use the API image's ffmpeg
        working-directory: .
        run: scripts/ci-media-tools.sh
      - run: just test

  contract:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: just contract
      - name: fail if the committed contract is stale
        working-directory: .
        run: git diff --exit-code -- api/openapi.json
