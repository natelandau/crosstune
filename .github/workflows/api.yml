---
name: API

on:
  pull_request:
  push:
    branches: [main]
    paths:
      ["api/**", "scripts/**", ".github/workflows/api.yml", ".pre-commit-config.yaml"]
  workflow_call:

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main and a Release call, falls back to its own run ID and is never canceled.
concurrency:
  group: api-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of relocking.
  UV_LOCKED: "1"
  CI: "true"

jobs:
  # The checks are required, so they run on every pull request and skip when it touches
  # nothing they cover; a skipped job passes a required check, a missing one blocks it.
  changes:
    name: API changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - id: changes
        uses: ./.github/actions/changes
        with:
          pattern: '^(api/|scripts/|\.github/workflows/api\.yml$|\.pre-commit-config\.yaml$)'

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: just lint
      - run: uv run shellcheck ../scripts/smoke.sh ../scripts/ci-media-tools.sh
      - name: prek
        working-directory: .
        run: |
          uv run --project api prek run --all-files --config .pre-commit-config.yaml
        env:
          PREK_SKIP: pytest,ty,web-eslint,web-prettier,web-tsc,site-eslint,site-prettier,site-tsc

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: docker info
      # The RustFS compatibility tests fail rather than skip when CI is set.
      - name: start RustFS
        working-directory: .
        run: docker compose up -d --wait rustfs
      - name: use the API image's ffmpeg
        working-directory: .
        run: scripts/ci-media-tools.sh
      - run: just test

  contract:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: uv sync --all-groups
      - run: just contract
      - name: fail if the committed contract is stale
        working-directory: .
        run: git diff --exit-code -- api/openapi.json
