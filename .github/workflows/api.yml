---
name: API

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "compose.yml"
      - "fixtures/**"
      - "ruff.toml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/gate-cache.sh"
      - "scripts/settings.just"
      - "scripts/media-tools.sh"
      - ".github/workflows/api.yml"
  workflow_call:

# A push to a pull request cancels that PR's previous run. Every other run, including a
# push to main and a Release call, falls back to its own run ID and is never canceled.
concurrency:
  group: api-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Fail when uv.lock disagrees with pyproject.toml instead of relocking.
  UV_LOCKED: "1"
  CI: "true"

jobs:
  # The checks are required, so they run on every pull request and skip when it touches
  # nothing they cover; a skipped job passes a required check, a missing one blocks it.
  changes:
    name: API changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      image: ${{ steps.image.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
        with:
          pattern: '^(api/|compose\.yml$|fixtures/|ruff\.toml$|pyproject\.toml$|uv\.lock$|scripts/((gate-cache|media-tools)\.sh|settings\.just)$|\.github/workflows/api\.yml$)'
      - id: image
        uses: ./.github/actions/changes
        with:
          pattern: '^(\.github/workflows/api\.yml|api/(Dockerfile|\.dockerignore|pyproject\.toml|uv\.lock|alembic\.ini))$'

  lint:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - run: uv sync --all-groups
      - run: just lint

  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - run: uv sync --all-groups
      # The RustFS compatibility tests fail rather than skip when CI is set.
      - name: start RustFS
        working-directory: .
        run: docker compose up -d --wait rustfs
      - run: just test

  # Railway builds the full image only after merge, and production's build only after
  # Release has promoted, so this is the one check that the image builds and imports
  # without the dev groups. A push to main skips it because its pull request ran it;
  # a Release call runs it so a broken image never reaches promote.
  image:
    needs: changes
    if: >-
      needs.changes.outputs.image == 'true'
      && !(github.event_name == 'push' && github.ref_type == 'branch')
    name: API Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag crosstune-api api
      - run: docker run --rm --entrypoint python crosstune-api -c "import crosstune.main"
      - run: docker run --rm --entrypoint alembic crosstune-api heads

  contract:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
      - run: uv sync --all-groups
      - run: just contract
      - name: fail if the committed contract is stale
        working-directory: .
        run: git diff --exit-code -- api/openapi.json
