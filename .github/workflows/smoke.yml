---
name: Smoke

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: API origin; blank uses the API_ORIGIN_PRODUCTION repository variable
        required: false
        type: string
      web_origin:
        description: Web origin; blank uses the WEB_ORIGIN_PRODUCTION repository variable
        required: false
        type: string
      site_origin:
        description: Site origin; blank uses the SITE_ORIGIN_PRODUCTION repository variable
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/smoke.sh "$API_ORIGIN" "$WEB_ORIGIN" "$SITE_ORIGIN"
        env:
          API_ORIGIN: ${{ inputs.api_origin || vars.API_ORIGIN_PRODUCTION }}
          WEB_ORIGIN: ${{ inputs.web_origin || vars.WEB_ORIGIN_PRODUCTION }}
          SITE_ORIGIN: ${{ inputs.site_origin || vars.SITE_ORIGIN_PRODUCTION }}
