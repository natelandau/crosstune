---
name: Smoke

on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: API origin; blank uses the API_ORIGIN_PRODUCTION repository variable
        required: false
        type: string
      web_origin:
        description: Web origin; blank uses the WEB_ORIGIN_PRODUCTION repository variable
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/smoke.sh "$API_ORIGIN" "$WEB_ORIGIN"
        env:
          API_ORIGIN: ${{ inputs.api_origin || vars.API_ORIGIN_PRODUCTION }}
          WEB_ORIGIN: ${{ inputs.web_origin || vars.WEB_ORIGIN_PRODUCTION }}
