---
rules:
  # Actions and the tools they install stay on version tags or their latest release,
  # which Dependabot and the actions move; hash and version pins are not required.
  # A job that holds the Apple signing keys pins each third-party action by commit hash,
  # by hand: the policy is per action, and these actions also run in other jobs.
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
  unpinned-tools:
    disable: true
  # actionlint cannot parse the `$/` form yet, so local actions keep `./`.
  self-repository:
    disable: true
