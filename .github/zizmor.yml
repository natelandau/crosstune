---
rules:
  # Actions and the tools they install stay on version tags or their latest release,
  # which Dependabot and the actions move; hash and version pins are not required.
  # The jobs that hold the Apple signing keys or the preview deploy tokens, and the shared
  # setup-node action, pin third-party actions by commit hash by hand. The policy is per
  # action, and these actions also run in other jobs.
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
  unpinned-tools:
    disable: true
  # actionlint cannot parse the `$/` form yet, so local actions keep `./`.
  self-repository:
    disable: true
