---
rules:
  # Every third-party action is pinned by commit hash, with its version in a comment that
  # Dependabot updates. A tag can be moved to other code; a hash cannot.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin
  unpinned-tools:
    disable: true
  # actionlint cannot parse the `$/` form yet, so local actions keep `./`.
  self-repository:
    disable: true
