<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16181D" />
    <!-- The app ships its own light and dark themes. color-scheme tells browsers and
         Dark Reader so; darkreader-lock tells Dark Reader to leave the page alone. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="darkreader-lock" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Crosstune</title>
    <script>
      // Stamps scheme, text size, and density before the first paint so nothing flashes.
      // The scheme resolves as applyScheme in src/theme/scheme.ts does.
      try {
        var root = document.documentElement
        var theme = null
        var size = null
        try {
          theme = localStorage.getItem('crosstune.appearance')
          size = localStorage.getItem('crosstune.textSize')
        } catch (e) {
          // Blocked storage: the system setting and the regular size apply.
        }
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.setAttribute('data-scheme', dark ? 'dark' : 'light')
        if (size === 'compact' || size === 'roomy') root.setAttribute('data-text-size', size)
        root.setAttribute(
          'data-density',
          window.matchMedia('(hover: hover) and (pointer: fine)').matches ? 'pointer' : 'touch',
        )
      } catch (e) {
        // matchMedia is missing: the CSS defaults apply.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
