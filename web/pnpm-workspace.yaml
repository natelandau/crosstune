allowBuilds:
  # Both resolve their platform binary from optional dependencies at runtime, and
  # the postinstall only hardlinks and checks the version, so denying it is safe.
  esbuild: false
  sharp: true
  workerd: false

peerDependencyRules:
  allowedVersions:
    # Only vite-plugin-pwa's pwaAssets option needs v1; the config does not use it, and the
    # `icons` recipe runs v2 directly.
    'vite-plugin-pwa>@vite-pwa/assets-generator': '2'
