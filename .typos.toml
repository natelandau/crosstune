[default]
    locale = "en-us"
    # Unicode ranges in @font-face declarations look like misspelled words.
    extend-ignore-re = ["U\\+[0-9A-Fa-f]{4}(?:-[0-9A-Fa-f]{4})?"]

[files]
    extend-exclude = [".cache", ".venv", "node_modules", "*.lock", "api/openapi.json", "pnpm-lock.yaml", "web/src/api/schema.d.ts", "web/src/routeTree.gen.ts", "web/dist", "web/dev-dist", "site/dist", "site/.astro"]

# The Web Audio API spells it AnalyserNode and createAnalyser; the en-us locale would flag both.
[default.extend-words]
    analyser = "analyser"
    # A mountain dulcimer tuning name (D-A-A), not a typo for "data".
    DAA = "DAA"
    # Apple's simulator and device ID (`simctl`, Maestro's --udid), not a typo for "uuid".
    udid = "udid"
