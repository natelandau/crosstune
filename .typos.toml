[default]
    locale = "en-us"

[files]
    extend-exclude = [".cache", ".venv", "node_modules", "*.lock", "web/src/api/openapi.json", "pnpm-lock.yaml", "web/src/api/schema.d.ts", "web/src/routeTree.gen.ts", "web/dist", "web/dev-dist"]

# The Web Audio API spells it AnalyserNode and createAnalyser; the en-us locale would flag both.
[default.extend-words]
    analyser = "analyser"
