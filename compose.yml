---
# The project name is fixed so every checkout, including a git worktree, reuses the one
# Postgres container and the one data volume instead of starting a second server on 5432.
name: crosstune

services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: crosstune
      POSTGRES_PASSWORD: crosstune
      POSTGRES_DB: crosstune
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosstune -d crosstune"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
