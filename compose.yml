---
# The project name is fixed so every checkout, including a git worktree, reuses the one
# Postgres container and the one data volume instead of starting a second server on 5432.
name: crosstune

services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: crosstune
      POSTGRES_PASSWORD: crosstune
      POSTGRES_DB: crosstune
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosstune -d crosstune"]
      interval: 2s
      timeout: 5s
      retries: 10

  # S3-compatible storage for local recordings, so local work never reaches a hosted bucket.
  rustfs:
    image: rustfs/rustfs:1.0.0
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: crosstune
      RUSTFS_SECRET_KEY: crosstune-local-secret
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  rustfs-data:
