---
services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: crosstune
      POSTGRES_PASSWORD: crosstune
      POSTGRES_DB: crosstune
    volumes:
      - .dev/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crosstune -d crosstune"]
      interval: 2s
      timeout: 5s
      retries: 10
