# Field names match the sync schema. `modes` and `alternate_titles` pick one entry.
# `status` and `notes` belong to the user's tune; `status` is always set.
[tunes]
    alternate_titles = ["Love Somebody", "Sail Away Lady", "Salt River"]
    composer = ["Gary Harrison", "Jay Ungar", "Lauchlin Shaw"]
    count = 20
    genre = ["Bluegrass", "Irish", "Old-time"]
    is_crooked = [true]
    key = ["A", "C", "D", "G"]
    lyrics = ["""
Ever I get my new house done,
Sail away, ladies, sail away,
Give the old one to my son,
Sail away, ladies, sail away.

Don't she rock 'em, die-dee-oh,
Don't she rock 'em, die-dee-oh."""]
    modes = ["major", "modal"]
    notes = [
        "Crooked: the A part drops a beat before the turnaround.",
        "Joe plays the B part an octave down the second time through.",
        "Lead with the shuffle; the B part sits high on the A string.",
        "Modal and crooked; count the extra beat in the B part.",
        "Practice the B part slow, then bring it back to tempo.",
    ]
    part_structure = ["AABB", "AABBCC", "AB"]
    status = ["known", "learning", "want_to_learn"]
    time_signature = ["3/4", "4/4"]
    tune_type = ["Breakdown", "Reel"]

    # One pick per instrument: a tuning name, or a table with a capo.
    [tunes.tunings]
        five_string_banjo = [
            "Open A (aEAC#E)",
            "Open G (gDGBD)",
            { capo = 2, tuning = "Double C (gCGCD)" },
            { capo = 2, tuning = "Open G (gDGBD)" },
        ]
        violin = ["Cross A (AEAE)", "Standard (GDAE)"]

# Each list takes a different name from `names` and holds min_size to max_size
# tunes. --lists overrides count; past the names, a name is reused with a random
# five-character tag.
[lists]
    count = 4
    max_size = 10
    min_size = 4
