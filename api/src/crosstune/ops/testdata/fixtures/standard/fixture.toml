# The standard test data fixture for `just api::testdata`.
#
# Each tune is titled "<first> <second>" from [names] and takes one value at random
# from each list in [tunes]. Every list but `status` also has an unset choice, so
# some tunes leave that field empty; an empty or missing list never sets it. The
# seed keeps the titles and picks the same on every run.

# first_created is the first tune's created_at. Later tunes follow a day apart, or
# closer so the last is not after today.
first_created = 2025-06-01
seed          = 7

[files]
    audio        = "recording.m4a"
    image        = "scan.jpg"
    image_height = 2200
    image_width  = 1700

# The kinds are proportions, scaled when --recordings asks for another count.
[recordings]
    count = 10
    labels = ["Jam recording", "Practice recording", "Slow run-through", "Up to tempo", "With the band"]
    microphone = 5
    slippery_hill = 2
    slippery_hill_urls = [
        "https://www.slippery-hill.com/system/files/recordings/bonapartesretreat_williamstamper.mp3",
        "https://www.slippery-hill.com/system/files/recordings/sailawayladies_unclebunttstamper.mp3",
        "https://www.slippery-hill.com/system/files/recordings/soldiersjoy_gidtannerskilletlickers.mp3",
    ]
    unfiled = 3
    upload = 3

[scans]
    count = 5

