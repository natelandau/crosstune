[project]
    authors = [{ name = "Nate Landau" }]
    dependencies = [
        "alembic>=1.19.2",
        "asyncpg>=0.31.0",
        "boto3>=1.43.94",
        "fastapi>=0.141.1",
        "httpx2>=2.12.0",
        "maxminddb>=3.2.0",
        "pydantic-settings>=2.15.0",
        "pydantic>=2.13.5",
        "pyjwt[crypto]>=2.14.0",
        "python-json-logger>=4.2.0",
        "sentry-sdk[fastapi]>=2.69.1",
        "sqlalchemy[asyncio]>=2.0.52",
        "uuid-utils>=1.0.0",
        "uvicorn[standard]>=0.52.4",
]
    description = "Crosstune API"
    name = "crosstune"
    requires-python = ">=3.13,<3.14"
    version = "1.3.0"

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.11.0,<0.14.0"]

[dependency-groups]
    dev = [
        "anyio>=4.15.1",
        "commitizen>=4.18.0",
        "committed>=1.1.12",
        "gate-cache>=0.4.0",
        "honcho>=2.0.0",
        "prek>=0.5.2",
        "pytest-cov>=7.1.0",
        "pytest-env>=1.7.1",
        "pytest-mock>=3.15.1",
        "pytest-xdist>=3.8.0",
        "pytest>=9.1.1",
        "pyyaml>=6.0.3",
        "ruff>=0.16.7",
        "ty>=0.0.80",
        "types-boto3[s3]>=1.43.94",
        { include-group = "typos" },
        "yamllint>=1.38.0",
]
    # Its own group so the other modules' spell checks install it alone.
    typos = ["typos>=1.50.1"]

[tool.coverage.report]
    exclude_lines = ['def __repr__', 'if TYPE_CHECKING', 'pragma: no cover']
    fail_under    = 80
    show_missing  = true
    skip_covered  = true
    skip_empty    = true

[tool.coverage.run]
    branch = true
    # SQLAlchemy's asyncio layer runs orm code inside greenlets, which coverage misses otherwise.
    concurrency      = ["greenlet"]
    data_file        = ".cache/coverage"
    disable_warnings = ["no-data-collected"]
    omit             = ["src/crosstune/db/migrations/*", "tests/*"]
    source           = ["src"]

[tool.coverage.xml]
    output = ".cache/coverage.xml"

[tool.pytest.ini_options]
    addopts        = "--color=yes --strict-config --strict-markers -n auto --dist worksteal"
    cache_dir      = ".cache/pytest"
    filterwarnings = ["error", "ignore::DeprecationWarning:"]
    testpaths      = ["tests"]
    xfail_strict   = true

[tool.pytest_env]
    CROSSTUNE_CLERK_AUTHORIZED_PARTIES           = '["http://testclient"]'
    CROSSTUNE_CLERK_ISSUER                       = "https://test.clerk.accounts.dev"
    CROSSTUNE_CLERK_WEBHOOK_SECRET               = "whsec_dGVzdHNlY3JldHRlc3RzZWNyZXQ="  # gitleaks:allow -- fixture, not a credential
    CROSSTUNE_CLERK_SECRET_KEY                   = "sk_test_dGVzdHNlY3JldHRlc3RzZWNyZXQ="  # gitleaks:allow -- fixture, not a credential
    CROSSTUNE_DEBUG                              = "true"
    # Pinned empty so a developer's api/.env billing keys cannot leak into the suite.
    CROSSTUNE_REVENUECAT_PROJECT_ID              = ""
    CROSSTUNE_REVENUECAT_SECRET_KEY              = ""
    CROSSTUNE_REVENUECAT_WEBHOOK_AUTH            = ""
    CROSSTUNE_STRIPE_CANCEL_KEY                  = ""
    CROSSTUNE_BILLING_ACCEPT_SANDBOX_STRIPE      = "false"
    # Pinned empty so a developer's api/.env Resend key cannot leak into the suite.
    CROSSTUNE_RESEND_API_KEY                     = ""
    # Pinned empty so a developer's api/.env Apple, Apple Maps, and TIDAL keys cannot leak into the suite.
    CROSSTUNE_APPLE_TEAM_ID                      = ""
    CROSSTUNE_APPLE_MUSIC_KEY_ID                 = ""
    CROSSTUNE_APPLE_MUSIC_PRIVATE_KEY            = ""
    CROSSTUNE_APPLE_MAPS_KEY_ID                  = ""
    CROSSTUNE_APPLE_MAPS_PRIVATE_KEY             = ""
    CROSSTUNE_SIGN_IN_WITH_APPLE_KEY_ID          = ""
    CROSSTUNE_SIGN_IN_WITH_APPLE_PRIVATE_KEY     = ""
    CROSSTUNE_TIDAL_CLIENT_ID                    = ""
    CROSSTUNE_TIDAL_CLIENT_SECRET                = ""
    # Pinned empty so a developer's api/.env DSN cannot leak into the suite.
    CROSSTUNE_SENTRY_DSN                         = ""
    # Pinned empty so a developer's api/.env storage settings cannot leak into the suite.
    CROSSTUNE_R2_ACCOUNT_ID                      = ""
    CROSSTUNE_STORAGE_BUCKET                     = ""
    CROSSTUNE_STORAGE_ACCESS_KEY_ID              = ""
    CROSSTUNE_STORAGE_SECRET_ACCESS_KEY          = ""
    CROSSTUNE_STORAGE_PREFIX                     = ""
    CROSSTUNE_LOCAL_STORAGE_ENDPOINT_URL         = ""
    CROSSTUNE_LOCAL_STORAGE_BROWSER_ENDPOINT_URL = ""
