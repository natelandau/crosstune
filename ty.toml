# One type check configuration for every Python file in the repository, on the API's
# environment. `root` lists the folders whose modules import each other.
[environment]
python = "api/.venv"
python-version = "3.13"
root = ["api/src", "scripts", "apple/scripts", "analytics"]

[src]
exclude = ["api/**/migrations/**", "api/tests/**"]

[terminal]
error-on-warning = true
