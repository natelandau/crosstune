# Type check configuration for the tooling Python, on the root tooling environment. The API
# has its own in api/pyproject.toml, which ty finds first when it runs from api/.
# `root` lists the folders whose modules import each other.
[environment]
python = ".venv"
python-version = "3.13"
root = ["scripts", "apple/scripts", "analytics"]

[src]
exclude = ["api/"]

[terminal]
error-on-warning = true
