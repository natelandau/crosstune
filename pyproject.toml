# Developer tooling for the whole repository: the git hooks, the linters, release commands, and
# the tooling scripts' Python. Not a package and never deployed; the API is its own project in
# api/, so its image and lockfile hold only what it runs.
[project]
    dependencies    = []
    description     = "Crosstune developer tooling"
    name            = "crosstune-tooling"
    requires-python = ">=3.13,<3.14"
    version         = "0.0.0"

[tool.uv]
    package = false

[dependency-groups]
    dev = [
        "commitizen>=4.18.0",
        "committed>=1.1.12",
        "gate-cache>=0.4.0",
        "honcho>=2.0.0",
        "httpx2>=2.12.0",
        "prek>=0.5.2",
        "pytest>=9.1.1",
        "pyyaml>=6.0.3",
        "ruff>=0.16.7",
        "ty>=0.0.80",
        { include-group = "typos" },
        "yamllint>=1.38.0",
]
    # Its own group so the modules' spell checks install it alone.
    typos = ["typos>=1.50.1"]
