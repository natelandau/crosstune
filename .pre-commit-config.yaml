---
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit, manual]
fail_fast: true
repos:
  - repo: "https://github.com/commitizen-tools/commitizen"
    rev: v4.19.0
    hooks:
      - id: commitizen

  - repo: "https://github.com/pre-commit/pre-commit-hooks"
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: ^(web|site)/pnpm-lock\.yaml$
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      # Every client reads the shared fixtures as they are, so no hook rewrites them. The
      # export ones pin exact bytes: CRLF records with LF inside quoted fields.
      - id: mixed-line-ending
        exclude: ^fixtures/(export|stats)/
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^fixtures/(export|stats)/

  - repo: "https://github.com/adrienverge/yamllint.git"
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: ^.*\.(yaml|yml)$
        entry: yamllint --strict --config-file .yamllint.yml

  - repo: "https://github.com/astral-sh/ruff-pre-commit"
    rev: v0.16.10
    hooks:
      - id: ruff-check
        files: ^api/
      - id: ruff-format
        files: ^api/
        args: [--check]

  - repo: "https://github.com/adhtruong/mirrors-typos"
    rev: v1.50.3
    hooks:
      - id: typos
        args: ["--force-exclude"]
        stages: [commit-msg, pre-commit]

  - repo: "https://github.com/gitleaks/gitleaks"
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: "https://github.com/python-jsonschema/check-jsonschema"
    rev: "0.38.2"
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]

  - repo: "https://github.com/Mateusz-Grzelinski/actionlint-py"
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: "https://github.com/zizmorcore/zizmor-pre-commit"
    rev: v1.30.1
    hooks:
      - id: zizmor
        # Named outright because discovery from a git worktree stops at the main checkout.
        args: ["--config", ".github/zizmor.yml"]

  - repo: "https://github.com/shellcheck-py/shellcheck-py"
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: "https://github.com/crate-ci/committed"
    rev: v1.1.11
    hooks:
      - id: committed
        stages: [commit-msg]

  - repo: "https://github.com/tsvikas/sync-with-uv"
    rev: v0.6.0
    hooks:
      - id: sync-with-uv
        files: ^api/
        args: ["-u", "api/uv.lock"]

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: just api::ty
        pass_filenames: false
        language: system
        files: ^api/.*\.py$

      - id: pytest
        name: pytest
        entry: just api::test
        language: system
        pass_filenames: false
        stages: [pre-push]
        # The seed test reads the Mac app's marketing catalog, and compose.yml runs its database.
        files: ^(api/|apple/Marketing/catalog\.json$|compose\.yml$|justfile$)

      - id: commitizen-branch
        name: commitizen check branch
        entry: bash -c 'uv run --project api --quiet cz check --rev-range "$PRE_COMMIT_FROM_REF..$PRE_COMMIT_TO_REF"' --
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: web-eslint
        name: eslint
        entry: just web::eslint
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|tsx|js|cjs|mjs)$

      - id: web-prettier
        name: prettier
        entry: just web::format
        language: system
        pass_filenames: false
        files: ^web/

      - id: web-tsc
        name: tsc
        entry: just web::tsc
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|tsx)$

      - id: web-vitest
        name: vitest
        entry: just web::test
        language: system
        pass_filenames: false
        stages: [pre-push]
        # Each path outside web/ is one a web test reads, and the root justfile runs every module.
        files: ^(web/|brand/|fixtures/|analytics/|api/openapi\.json$|justfile$)

      - id: site-eslint
        name: eslint
        entry: just site::eslint
        language: system
        pass_filenames: false
        files: ^site/.*\.(ts|js|cjs|mjs|astro)$

      - id: site-prettier
        name: prettier
        entry: just site::format
        language: system
        pass_filenames: false
        files: ^site/

      - id: site-tsc
        name: tsc
        entry: just site::tsc
        language: system
        pass_filenames: false
        files: ^site/.*\.(ts|astro)$

      - id: site-vitest
        name: vitest
        entry: just site::test
        language: system
        pass_filenames: false
        stages: [pre-push]
        files: ^(site/|brand/|justfile$)

      - id: apple-swift-format
        name: swift format
        entry: just apple::format
        language: system
        pass_filenames: false
        files: ^apple/.*\.swift$

      - id: analytics-check
        name: tracking plan
        entry: just analytics::check
        language: system
        pass_filenames: false
        files: ^analytics/

      - id: apple-swift-test
        name: swift test
        entry: just apple::test
        language: system
        pass_filenames: false
        stages: [pre-push]
        # The tracking plan test reads analytics/, and the root justfile runs every module.
        files: ^(apple/|fixtures/|analytics/|api/openapi\.json$|justfile$)
