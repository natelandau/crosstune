# Set explicitly so pnpm fails on a release younger than a day instead of
# exempting it in minimumReleaseAgeExclude.
minimumReleaseAge: 1440

allowBuilds:
  # Each resolves its platform binary from optional dependencies at runtime, and the
  # postinstall only hardlinks and checks the version, so denying it is safe.
  esbuild: false
  workerd: false
  sharp: true
  # Optional native speedups and polyfill banners; nothing needs them at build time.
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  utf-8-validate: false

overrides:
  # @napi-rs/wasm-runtime accepts the 2.0 prereleases, which break against the
  # 1.x @emnapi/core that astro's language server loads.
  '@emnapi/runtime': ^1.11.3
